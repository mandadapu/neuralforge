[metadata]
name = nw-agent
version = 0.1.0
description = NeuralWarden VM Agent

[options]
python_requires = >=3.8
install_requires =
    requests>=2.31.0

[tool:pip-compile]
# Regenerate the hash-pinned lockfile:
#   pip-compile --generate-hashes requirements.in -o requirements.txt
generate_hashes = true
output_file = requirements.txt
